# TrashformerPro four-bin mapping.
# Assumption for the current prototype:
# clothes and shoes fall into the catch-all bin because the hardware only
# supports four compartments and there is no dedicated textile/shoe path.

plastic:
  - plastic

paper_cardboard:
  - paper
  - cardboard

metal_glass:
  - metal
  - glass

trash_other:
  - trash
  - biological
  - battery
  - clothes
  - shoes
